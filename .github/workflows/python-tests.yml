name: Python Tests

on:
  push:
    branches: [ Master, claude/* ]
  pull_request:
    branches: [ Master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black mypy
        # 确保pyyaml已安装（ConfigManager需要）
        pip install pyyaml

    - name: Lint with flake8
      run: |
        # 停止构建如果有Python语法错误或未定义的名称
        flake8 Run/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # 退出码0表示所有检查通过
        flake8 Run/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code formatting with black
      run: |
        black --check Run/ --line-length 100

    - name: Type check with mypy
      run: |
        mypy Run/ --ignore-missing-imports || true

    - name: Test with pytest
      run: |
        # 如果tests目录存在则运行测试，否则跳过
        if [ -d "tests" ]; then
          pytest tests/ --cov=Run --cov-report=xml --cov-report=term
        else
          echo "⚠️  tests目录不存在，跳过单元测试"
          echo "建议创建tests目录并添加单元测试"
        fi
      continue-on-error: true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  syntax-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Check Python syntax
      run: |
        # 使用find命令递归查找所有.py文件并检查语法
        echo "检查Python语法..."
        find Run -name "*.py" -type f -exec python -m py_compile {} \;
        echo "✓ 所有Python文件语法检查通过"
